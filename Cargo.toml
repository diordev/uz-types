[package]
name = "uz-types"
version = "0.20.0"
authors = ["Diyorbek Abdumutalibov <diordev@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Rust loyihalar uchun qayta ishlatiladigan type, value object va domain model'lar kutubxonasi."
documentation = "https://docs.rs/uz-types"
repository = "https://github.com/diordev/uz-types"
readme = "README.md"
keywords = ["types", "value-object", "domain-model", "validation", "uzbekistan"]
categories = ["data-structures", "rust-patterns"]

edition = "2024"
# Edition 2024 chegarasi. `sqlx` feature'i alohida 1.94+ talab qiladi (sqlx 0.9),
# lekin u optional — cargo per-feature MSRV'ni qo'llab-quvvatlamaydi, shuning uchun
# bu yerda eng past umumiy qiymat turadi. Qarang: README § MSRV va semver.
rust-version = "1.85"

include = [
    "README.md",
    "CHANGELOG.md",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "benches/*.rs"
]

[features]
default = ["date", "id"]
date = ["dep:chrono", "sqlx?/chrono"]
id = ["dep:uuid", "sqlx?/uuid"]
serde = ["dep:serde", "uuid?/serde"]
sqlx = ["dep:sqlx"]
sqlx-postgres = ["sqlx", "sqlx/postgres"]
zeroize = ["dep:zeroize"]
serialize-secrets = ["serde"]

[dependencies]
thiserror = "2"
subtle = { version = "2.6", default-features = false }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std", "clock"] }
uuid = { version = "1.26", optional = true, default-features = false, features = ["std", "v4", "v7"] }
serde = { version = "1", optional = true, default-features = false, features = ["std"] }
sqlx = { version = "0.9", optional = true, default-features = false }
zeroize = { version = "1", optional = true, default-features = false, features = ["alloc"] }


[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies.criterion]
version = "0.8"
default-features = false

[[bench]]
name = "parse"
harness = false

# Example `BirthDate` va `JobId` ishlatadi — busiz
# `cargo check --all-targets --no-default-features` kompilyatsiya bo'lmaydi.
[[example]]
name = "types_example"
required-features = ["date", "id"]
