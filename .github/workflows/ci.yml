name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format tekshiruvi
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Testlar
        run: cargo test --all-features

      - name: Example ishga tushishi
        run: cargo run --example types_example

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Hujjatlarni build qilish
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Cargo per-feature MSRV'ni qo'llab-quvvatlamaydi, shuning uchun ikkita job:
  # e'lon qilingan `rust-version` (sqlx'siz) va sqlx feature'i talab qiladigan pol.
  msrv:
    name: MSRV (1.85, sqlx'siz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      # `--all-targets` EMAS: u dev-dependency'larni (criterion → 1.86) tortadi,
      # downstream esa ularni yuklamaydi. `rust-version` iste'molchi uchun.
      - name: Feature'siz
        run: cargo check --no-default-features

      - name: sqlx'siz barcha feature'lar
        run: cargo check --features date,id,serde,zeroize,serialize-secrets

  msrv-sqlx:
    name: MSRV (1.94, sqlx bilan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2

      - name: Barcha feature'lar bilan build
        run: cargo check --all-targets --all-features

  live-postgres:
    name: PostgreSQL 16 roundtrip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2

      - name: Jonli PostgreSQL testlari
        run: just postgres-test

  # `--all-features` bitta nuqta — feature kombinatsiyalari alohida tekshiriladi.
  # Ro'yxat Cargo.toml dan olinadi, qo'lda yozilmaydi.
  features:
    name: feature kombinatsiyalari
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: Powerset (kompilyatsiya)
        run: cargo hack check --feature-powerset --all-targets

      - name: Har feature alohida (test + doctest)
        run: cargo hack test --each-feature

  audit:
    name: audit (CVE + machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-machete
      - uses: Swatinem/rust-cache@v2

      - name: Ma'lum zaifliklar
        run: cargo audit

      - name: Ishlatilmagan dependency'lar
        run: cargo machete --with-metadata

  # Tanlangan versiya bump'i o'zgarishlarni qoplaydimi.
  # Nima aynan breaking ekanini ko'rish: `just semver-detail`.
  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Global `RUSTFLAGS: -D warnings` bu yerda o'chiriladi: semver-checks eski
      # relizni (baseline) ham quradi va uni yangi rustc lint'lari bilan
      # jazolash noto'g'ri — biz o'sha kodni tekshirmayapmiz.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        env:
          RUSTFLAGS: ""

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Nashrga tayyorlikni tekshirish
        run: cargo package --locked
